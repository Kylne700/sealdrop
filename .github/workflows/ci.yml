name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No secrets in CI. Without VITE_DEMO_SENDER_PRIVATE_KEY the app still builds and offers wallet mode only.
      - run: npm run build
      - run: npm test
